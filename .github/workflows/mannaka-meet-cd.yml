# マンナカを Cloud Run へデプロイする CD。リポジトリのルートで動かす。
#
# ■ 動き方
#   main への push と、Actions タブからの手動実行で起動する。
#   テストは常に流れる。デプロイは Variables の CD_ENABLED が "true" の
#   ときだけ動き、無ければテストで終わる（既定で安全側）。
#
# ■ デプロイをオンにする
#   GitHub の Settings > Secrets and variables > Actions > Variables に
#   CD_ENABLED = true を作る。オフに戻すときは false にするか変数ごと削除する。
#
# ■ 必要な Variables
#   CD_ENABLED             デプロイまで進めるかどうか
#   WIF_PROVIDER           Workload Identity プロバイダのリソース名
#   DEPLOY_SERVICE_ACCOUNT デプロイに使うサービスアカウント
#   鍵ファイルは置かない。GitHub の OIDC トークンを Google 側で受ける。

name: マンナカ CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "デプロイまで実行する（false ならテストのみ）"
        type: boolean
        default: false

  push:
    branches: [main]

env:
  PROJECT_ID: mannaka-meet
  REGION: asia-northeast1
  SERVICE: mannaka-meet

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存をインストール
        run: pip install ".[dev]"

      # Firestore の実接続テストは FIRESTORE_EMULATOR_HOST が無いので自動でスキップされる
      - name: pytest
        env:
          REPOSITORY: memory
        run: pytest -q

  deploy:
    name: Cloud Run へデプロイ
    needs: test
    runs-on: ubuntu-latest
    # CD_ENABLED が true で、かつ手動実行時に deploy を選んだときだけ動く
    if: vars.CD_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必要
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud に認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: デプロイ
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
            --quiet

      - name: 起動確認（/health）
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          echo "デプロイ先: $URL"
          curl -sSf --retry 5 --retry-delay 3 "$URL/health" | tee /dev/stderr | grep -q '"status":"ok"'
          echo "### デプロイ完了: $URL" >> "$GITHUB_STEP_SUMMARY"
