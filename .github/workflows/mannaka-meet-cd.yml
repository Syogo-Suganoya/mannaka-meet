# マンナカを Cloud Run へデプロイする CD。リポジトリのルートで動かす。
#
# ■ 現在の状態: 自動デプロイはオフ
#   push では起動しない。手動実行（Actions タブの "Run workflow"）だけができる。
#   さらに安全側に倒すため、環境変数 CD_ENABLED が "true" でなければ
#   デプロイ手前で停止する（テストだけ流して終わる）。
#
# ■ オンにする手順
#   1. GitHub の Settings > Secrets and variables > Actions > Variables で
#      CD_ENABLED = true を作る（これだけで手動デプロイが通るようになる）
#   2. main への push でも動かしたいときは、下の `push:` のコメントを外す
#   3. 認証情報（Variables / Secrets）は DEPLOY.md「パターンC」を参照
#
# ■ オフに戻す手順
#   CD_ENABLED を false にする（または変数ごと削除する）。
#   push トリガーを付けている場合はコメントに戻す。

name: マンナカ CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "デプロイまで実行する（false ならテストのみ）"
        type: boolean
        default: false

  push:
    branches: [main]

env:
  PROJECT_ID: mannaka-meet
  REGION: asia-northeast1
  SERVICE: mannaka-meet

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存をインストール
        run: pip install ".[dev]"

      # Firestore の実接続テストは FIRESTORE_EMULATOR_HOST が無いので自動でスキップされる
      - name: pytest
        env:
          REPOSITORY: memory
        run: pytest -q

  deploy:
    name: Cloud Run へデプロイ
    needs: test
    runs-on: ubuntu-latest
    # CD_ENABLED が true で、かつ手動実行時に deploy を選んだときだけ動く
    if: vars.CD_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必要
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud に認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: デプロイ
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
            --quiet

      - name: 起動確認（/health）
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          echo "デプロイ先: $URL"
          curl -sSf --retry 5 --retry-delay 3 "$URL/health" | tee /dev/stderr | grep -q '"status":"ok"'
          echo "### デプロイ完了: $URL" >> "$GITHUB_STEP_SUMMARY"
